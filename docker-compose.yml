
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: verifeed_db
    environment:
      POSTGRES_USER: verifeed_user
      POSTGRES_PASSWORD: verifeed_password
      POSTGRES_DB: verifeed_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifeed_user -d verifeed_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: verifeed_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: verifeed_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://verifeed_user:verifeed_password@db:5432/verifeed_db
      REDIS_URL: redis://redis:6379/0
      RSS_BRIDGE_URL: http://rss-bridge:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: verifeed_worker
    command: uv run celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://verifeed_user:verifeed_password@db:5432/verifeed_db
      REDIS_URL: redis://redis:6379/0
      RSS_BRIDGE_URL: http://rss-bridge:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rss-bridge:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: verifeed_beat
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://verifeed_user:verifeed_password@db:5432/verifeed_db
      REDIS_URL: redis://redis:6379/0
      RSS_BRIDGE_URL: http://rss-bridge:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rss-bridge:
        condition: service_healthy
    restart: unless-stopped

  # ── Phase 1: RSS Bridge — converts public Facebook pages to Atom feeds ──────
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: verifeed_rss_bridge
    ports:
      - "3001:80"  # Access via http://localhost:3001 for local debugging
    volumes:
      - ./rss-bridge-config:/config  # Optional: custom whitelist config
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://localhost:80/');"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
