[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Grayson Comrade Msiska", email = "comradegray7.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "feedparser>=6.0.14",
    "google-genai>=2.23.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "trafilatura>=2.2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
api = "api:main"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pyright]
extraPaths = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001", "DTZ001"]

